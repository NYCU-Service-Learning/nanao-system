services:
  frontend-dev:
    image: localhost/nycu_service-learning-nanao:frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/:/workdir
    environment:
      - BACKEND_URL=backend-dev
    depends_on:
      - backend-dev
      - db-dev
  backend-dev:
    image: localhost/nycu_service-learning-nanao:backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/:/workdir
    environment:
      CORS_ORIGIN: http://frontend-dev:5173
      DATABASE_URL: mysql://root:example@db-dev:3306/nanao_db
    depends_on:
      db-dev:
        condition: service_healthy
  db-dev:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: nanao_db
      MYSQL_USER: nanao_user
      MYSQL_PASSWORD: nanao_password
    volumes:
      - db-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
